[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="fonts/OFL.txt,licenses/*"
exclude_filter="docs/*,tests/*,tools/*,.github/*"
export_path="build/windows/Trashbeats.exe"
script_export_mode=2

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
debug/export_console_wrapper=1
codesign/enable=false
application/product_name="TrashBeats"
application/file_description="TrashBeats music interaction prototype"
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="fonts/OFL.txt,licenses/*"
exclude_filter="docs/*,tests/*,tools/*,.github/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.1.options]
variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2

[preset.2]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="fonts/OFL.txt,licenses/*"
exclude_filter="docs/*,tests/*,tools/*,.github/*"
export_path="build/linux/Trashbeats.x86_64"
script_export_mode=2

[preset.2.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true

[preset.3]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="fonts/OFL.txt,licenses/*"
exclude_filter="docs/*,tests/*,tools/*,.github/*"
export_path="build/macos/Trashbeats.zip"
script_export_mode=2

[preset.3.options]
application/bundle_identifier="io.github.l1xy6.trashbeats"
codesign/codesign=1
privacy/microphone_usage_description="Record sounds only when you press Record to make instruments and music."
